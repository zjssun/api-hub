server.port=8080
spring.application.name=api-hub

scheduler.enabled=false
scheduler.time = 2400000
faceit.api.base-url=https://open.faceit.com/data/v4
faceit.api.token=${FACEIT_API_TOKEN}
faceit.api.history-limit=3

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/eptracker?serverTimezone=GMT%2B8&useUnicode=true&characterEncoding=utf8&autoReconnect=true&allowMultiQueries=true&useSSL=false&rewriteBatchedStatements=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.pool-name=HikariCPDatasource
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=180000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1

spring.data.redis.database=0
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.jedis.pool.max-active=20
spring.data.redis.jedis.pool.max-wait=-1
spring.data.redis.jedis.pool.max-idle=10
spring.data.redis.jedis.pool.min-idle=0
spring.data.redis.timeout=2000

mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ===== video parser =====
# \u9ED8\u8BA4\u8BC6\u522B PATH\uFF1B\u4E0D\u5728 PATH \u65F6\u901A\u8FC7\u73AF\u5883\u53D8\u91CF\u6216\u6539\u8FD9\u91CC\u6307\u5B9A\u7EDD\u5BF9\u8DEF\u5F84
youtube.ytdlp-path=${YTDLP_PATH:yt-dlp}
# \u7559\u7A7A = yt-dlp \u81EA\u52A8\u4ECE PATH \u67E5\u627E ffmpeg/ffprobe\uFF1B\u4E0D\u5728 PATH \u65F6\u6307\u5411\u5176\u6240\u5728\u76EE\u5F55
youtube.ffmpeg-path=${FFMPEG_PATH:}
youtube.output-dir=./downloads
# \u5355\u6587\u4EF6\u4E0B\u8F7D\u5927\u5C0F\u4E0A\u9650\uFF0C\u9632\u5360\u670D\u52A1\u5668\u5E26\u5BBD\uFF1B\u7F6E\u7A7A\u4E0D\u9650\u5236
youtube.cookies-file=${YOUTUBE_COOKIES_FILE:}
# \u8D70\u4EE3\u7406\u7684\u4EE3\u7406\u5730\u5740\uFF08host:port\uFF09\uFF0C\u5C01\u9762\u62C9\u53D6\u548C yt-dlp \u90FD\u751F\u6548\uFF1B\u7559\u7A7A\u76F4\u8FDE
youtube.proxy=${YOUTUBE_PROXY:}
youtube.api-key=${YOUTUBE_API_KEY:}
youtube.max-concurrent=3
youtube.retention-hours=24
youtube.resolve-timeout-seconds=60
youtube.download-timeout-minutes=60
youtube.default-format-selector=bv*+ba/b
youtube.audio-format=mp3

# ===== comments =====
# \u654F\u611F\u8BCD\u5E93\uFF08\u5916\u90E8\u6587\u4EF6\uFF0C\u9ED8\u8BA4\u8BFB doc/vocabulary/banword.txt\uFF0C\u670D\u52A1\u5668\u4E0A\u53EF\u7528\u73AF\u5883\u53D8\u91CF\u6539\u8DEF\u5F84\uFF09
comment.banword-file=${COMMENT_BANWORD_FILE:}
comment.max-length=500
comment.list-limit=50
comment.rate-limit-seconds=10

# ===== \u8D26\u53F7 / \u7528\u91CF\u914D\u989D =====
# 163 SMTP \u53D1\u4FE1\uFF08password \u586B\u6388\u6743\u7801\u4E0D\u662F\u767B\u5F55\u5BC6\u7801\uFF09
spring.mail.host=smtp.163.com
spring.mail.port=465
spring.mail.protocol=smtp
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.default-encoding=UTF-8
# \u6BCF\u65E5\u4E0B\u8F7D\u914D\u989D\uFF08MB\uFF09\uFF1A\u6E38\u5BA2 / \u767B\u5F55\u7528\u6237
quota.anonymous-mb=100
quota.free-mb=3072
quota.admin-mb=${QUOTA_ADMIN_MB:30720}
# \u670D\u52A1\u603B\u5F00\u5173\uFF1Atrue = \u5173\u95ED\u89E3\u6790/\u4E0B\u8F7D\u901A\u9053\uFF08\u524D\u7AEF\u7528\u91CF\u5361\u663E\u793A"\u670D\u52A1\u5668\u7528\u91CF\u5DF2\u7528\u5B8C"\uFF09
service.closed=${SERVICE_CLOSED:false}