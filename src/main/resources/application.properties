server.port=8080
spring.application.name=api-hub

scheduler.enabled=false
scheduler.time = 2400000
faceit.api.base-url=https://open.faceit.com/data/v4
faceit.api.token=${FACEIT_API_TOKEN}
faceit.api.history-limit=3

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/eptracker?serverTimezone=GMT%2B8&useUnicode=true&characterEncoding=utf8&autoReconnect=true&allowMultiQueries=true&useSSL=false&rewriteBatchedStatements=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.pool-name=HikariCPDatasource
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=180000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1

spring.data.redis.database=0
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6379
spring.data.redis.jedis.pool.max-active=20
spring.data.redis.jedis.pool.max-wait=-1
spring.data.redis.jedis.pool.max-idle=10
spring.data.redis.jedis.pool.min-idle=0
spring.data.redis.timeout=2000

mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ===== video parser =====
# 默认识别 PATH；不在 PATH 时通过环境变量或改这里指定绝对路径
youtube.ytdlp-path=${YTDLP_PATH:yt-dlp}
# 留空 = yt-dlp 自动从 PATH 查找 ffmpeg/ffprobe；不在 PATH 时指向其所在目录
youtube.ffmpeg-path=${FFMPEG_PATH:}
youtube.output-dir=./downloads
# YouTube cookies 文件（Netscape 格式 cookies.txt），应对 "sign in to confirm you're not a bot" 风控；留空匿名解析
youtube.cookies-file=${YOUTUBE_COOKIES_FILE:}
# 走代理的代理地址（host:port），封面拉取和 yt-dlp 都生效；留空直连
youtube.proxy=${YOUTUBE_PROXY:}
youtube.api-key=${YOUTUBE_API_KEY:}
youtube.max-concurrent=3
youtube.retention-hours=24
youtube.resolve-timeout-seconds=60
youtube.download-timeout-minutes=60
# 默认格式选择器（quality 缺省时）：avc1+m4a 优先 → 可微信分享，兜底原编码
youtube.default-format-selector=bv*[vcodec^=avc1]+ba[acodec^=mp4a]/bv*[vcodec^=avc1]+ba/b[vcodec^=avc1]/bv*+ba/b
# 下载产物缓存：相同链接+参数复用已下文件（命中仍计当日配额）；cache-max-mb 为目录总量上限，超限按最旧先删
youtube.cache-enabled=${YOUTUBE_CACHE_ENABLED:true}
youtube.cache-max-mb=${YOUTUBE_CACHE_MAX_MB:20480}
# yt-dlp 提取器参数（YouTube 风控攻防调参口，如 youtube:player_client=default,-tv 或注入 po_token）；留空不传
youtube.extractor-args=${YTDLP_EXTRACTOR_ARGS:}
youtube.audio-format=mp3
# 多视频/播放列表链接单次最多下载条目数，产物多于一个时自动打包 zip
youtube.playlist-max-items=${YOUTUBE_PLAYLIST_MAX_ITEMS:10}

# ===== comments =====
# 敏感词库（外部文件，默认读 doc/vocabulary/banword.txt，服务器上可用环境变量改路径）
comment.banword-file=${COMMENT_BANWORD_FILE:}
comment.max-length=500
comment.list-limit=50
comment.rate-limit-seconds=10

# ===== 账号 / 用量配额 =====
# 阿里云短信服务（Dysmsapi）验证码；AK/SK 留空走 DefaultCredentialProvider（环境变量/凭据文件/RAM 链）
sms.sign-name=${SMS_SIGN_NAME:}
sms.template-code=${SMS_TEMPLATE_CODE:SMS_512513446}
sms.region=cn-shenzhen
sms.endpoint=dysmsapi.aliyuncs.com
sms.access-key-id=${ALIBABA_CLOUD_ACCESS_KEY_ID:}
sms.access-key-secret=${ALIBABA_CLOUD_ACCESS_KEY_SECRET:}
# 每日下载配额（MB）：游客 / 登录用户
quota.anonymous-mb=100
quota.free-mb=3072
quota.admin-mb=${QUOTA_ADMIN_MB:30720}
# 服务总开关：true = 关闭解析/下载通道（前端用量卡显示"服务器用量已用完"；管理员不受限）
service.closed=${SERVICE_CLOSED:false}
